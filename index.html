<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventograma</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --cor-card: #ffffff;
            --cor-texto: #333333;
            --cor-titulo: #2c3e50;
            --cor-evento: #3498db;
            --cor-evento-texto: #ffffff;
            --cor-hoje-borda: #e74c3c;
            --cor-hoje-fundo: #fadbd8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            color: var(--cor-texto);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .controles {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 1000px;
        }

        .controles button {
            background-color: transparent;
            border: none;
            font-size: 26px;
            color: var(--cor-titulo);
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .controles button:hover {
            background-color: #e2e6e9;
        }

        #mes-titulo {
            font-size: 22px;
            font-weight: bold;
            color: var(--cor-titulo);
            text-transform: capitalize;
            min-width: 200px;
            text-align: center;
            margin: 0;
        }

        #eventograma {
            width: 100%;
            max-width: 1000px;
        }

        .mes {
            background: var(--cor-card);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
        }

        .grid-dias {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .dia-semana {
            font-weight: bold;
            font-size: 0.9em;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 2px solid #ecf0f1;
        }

        .dia {
            border-radius: 6px;
            background-color: #f9f9f9;
            border: 1px solid #eaeaea;
            height: 85px;
            display: flex;
            flex-direction: column;
            padding: 6px;
            transition: background-color 0.2s;
            overflow-y: auto;
        }

        .dia:not(.vazio) {
            cursor: pointer;
        }

        .dia.vazio {
            background-color: transparent;
            border: 1px solid transparent;
            pointer-events: none;
        }

        .dia::-webkit-scrollbar {
            width: 4px;
        }

        .dia::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .dia:not(.vazio):hover {
            background-color: #f1f2f6;
        }

        .numero-dia {
            align-self: flex-end;
            font-size: 0.9em;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 4px;
        }

        .dia.hoje {
            background-color: var(--cor-hoje-fundo);
            border: 2px solid var(--cor-hoje-borda);
        }

        .dia.hoje .numero-dia {
            color: var(--cor-hoje-borda);
        }

        .tag-evento {
            background-color: var(--cor-evento);
            color: var(--cor-evento-texto);
            font-size: 0.7em;
            font-weight: 500;
            padding: 3px 6px;
            border-radius: 4px;
            margin-bottom: 3px;
            word-wrap: break-word;
            line-height: 1.2;
        }

        .btn-hoje {
            margin-top: 15px;
            background-color: var(--cor-titulo);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .btn-hoje:hover {
            background-color: #1a252f;
        }

        /* =========================================================
           MODAL COM O DESCRITIVO DO DIA
           ========================================================= */

        .modal-dia {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.35);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-conteudo {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.18);
            position: relative;
        }

        .modal-conteudo h3 {
            color: var(--cor-titulo);
            margin: 0 30px 15px 0;
        }

        .modal-fechar {
            position: absolute;
            right: 15px;
            top: 10px;
            border: none;
            background: transparent;
            font-size: 26px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .modal-evento {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
        }

        .modal-evento:first-child {
            border-top: none;
            padding-top: 0;
        }

        .modal-evento strong {
            color: var(--cor-titulo);
        }

        .modal-evento p {
            margin: 6px 0 0;
            line-height: 1.5;
            color: var(--cor-texto);
        }

        .modal-sem-evento {
            color: #7f8c8d;
        }
    </style>
</head>

<body>

    <div class="controles">
        <button onclick="mudarMes(-1)">&#10094;</button>
        <h2 id="mes-titulo">Mês Ano</h2>
        <button onclick="mudarMes(1)">&#10095;</button>
    </div>

    <div id="eventograma"></div>

    <button class="btn-hoje" onclick="irParaHoje()">
        Voltar para o Mês Atual
    </button>


    <!-- =========================================================
         JANELA QUE APARECE AO CLICAR NO DIA
         ========================================================= -->

    <div id="modal-dia" class="modal-dia" onclick="fecharModal(event)">

        <div class="modal-conteudo">

            <button class="modal-fechar" onclick="fecharModal()">
                ×
            </button>

            <h3 id="modal-data"></h3>

            <div id="modal-descricao"></div>

        </div>

    </div>


    <script>

        // ====================================================================
        // 1. ESCREVA SEUS EVENTOS AQUI ABAIXO
        //
        // FORMATO:
        //
        // DATA - NOME DO EVENTO | DESCRIÇÃO
        //
        // A parte depois do "|" só será exibida quando clicar no dia.
        // ====================================================================

        const listaDeTexto = `

        27 de agosto de 2026 - Dia da Mopa | Descritivo completo sobre o Dia da Mopa.

        20 a 22 de agosto de 2026 - Semana da Mopa | Durante esses dias serão realizadas atividades relacionadas à Semana da Mopa.

        12 a 16 de outubro - Semana Interna de Treinamento | Semana destinada às capacitações e treinamentos internos.

        25/12 - Natal | Feriado de Natal.

        12/05/2026 - aniversario de juan | Aniversário de Juan.

        `;

        // ====================================================================


        const dataAtualReal = new Date();

        let dataVisualizacao = new Date();


        // ====================================================================
        // INTERPRETA OS EVENTOS
        // ====================================================================

        function interpretarEventos(texto) {

            const eventosProcessados = [];

            const linhas = texto.split('\n');

            const anoPadrao = dataAtualReal.getFullYear();


            const mesesMap = {

                'janeiro': '01',
                'fevereiro': '02',

                'março': '03',
                'marco': '03',

                'abril': '04',
                'maio': '05',
                'junho': '06',
                'julho': '07',
                'agosto': '08',
                'setembro': '09',
                'outubro': '10',
                'novembro': '11',
                'dezembro': '12'
            };


            linhas.forEach(linha => {

                linha = linha.trim();

                if (!linha) return;


                // ============================================================
                // FORMATO:
                // 27 de agosto de 2026 - Evento
                // 20 a 22 de agosto de 2026 - Evento
                // ============================================================

                const regExt =
                    /^(\d{1,2})(?:\s+a\s+(\d{1,2}))?\s+de\s+([a-zA-ZÀ-ÿ]+)(?:\s+de\s+(\d{4}))?\s*-\s*(.+)$/i;


                const matchExt = linha.match(regExt);


                if (matchExt) {

                    let diaIn =
                        matchExt[1].padStart(2, '0');


                    let diaFim =
                        matchExt[2]
                            ? matchExt[2].padStart(2, '0')
                            : null;


                    let mesNum =
                        mesesMap[
                            matchExt[3].toLowerCase()
                        ];


                    let ano =
                        matchExt[4] || anoPadrao;


                    // ========================================================
                    // SEPARA:
                    //
                    // Nome do evento | descrição
                    // ========================================================

                    let conteudo =
                        matchExt[5].trim();


                    let partes =
                        conteudo.split('|');


                    let nome =
                        partes[0].trim();


                    let descricao =
                        partes.slice(1).join('|').trim();


                    if (mesNum) {

                        if (diaFim) {

                            eventosProcessados.push({

                                inicio:
                                    `${ano}-${mesNum}-${diaIn}`,

                                fim:
                                    `${ano}-${mesNum}-${diaFim}`,

                                nome,

                                descricao
                            });

                        }

                        else {

                            eventosProcessados.push({

                                data:
                                    `${ano}-${mesNum}-${diaIn}`,

                                nome,

                                descricao
                            });

                        }

                        return;
                    }
                }


                // ============================================================
                // FORMATO:
                //
                // 25/12 - Natal
                // 12/05/2026 - Evento
                // ============================================================

                const regCurto =
                    /^(\d{1,2}\/\d{1,2}(?:\/\d{4})?)(?:\s+a\s+(\d{1,2}\/\d{1,2}(?:\/\d{4})?))?\s*-\s*(.+)$/i;


                const matchCurto =
                    linha.match(regCurto);


                if (matchCurto) {


                    const converte = (dStr) => {

                        let p =
                            dStr.split('/');


                        let dia =
                            p[0].padStart(2, '0');


                        let mes =
                            p[1].padStart(2, '0');


                        let ano =
                            p[2] || anoPadrao;


                        return `${ano}-${mes}-${dia}`;
                    };


                    let inicio =
                        converte(matchCurto[1]);


                    let diaFim =
                        matchCurto[2];


                    let conteudo =
                        matchCurto[3].trim();


                    let partes =
                        conteudo.split('|');


                    let nome =
                        partes[0].trim();


                    let descricao =
                        partes.slice(1).join('|').trim();


                    if (diaFim) {

                        eventosProcessados.push({

                            inicio: inicio,

                            fim:
                                converte(diaFim),

                            nome,

                            descricao
                        });

                    }

                    else {

                        eventosProcessados.push({

                            data: inicio,

                            nome,

                            descricao
                        });

                    }

                }

            });


            return eventosProcessados;
        }



        const eventos =
            interpretarEventos(listaDeTexto);



        const mesesNomes = [

            "Janeiro",
            "Fevereiro",
            "Março",
            "Abril",
            "Maio",
            "Junho",
            "Julho",
            "Agosto",
            "Setembro",
            "Outubro",
            "Novembro",
            "Dezembro"

        ];


        const diasSemana = [

            "Dom",
            "Seg",
            "Ter",
            "Qua",
            "Qui",
            "Sex",
            "Sáb"

        ];



        // ====================================================================
        // RENDERIZA O CALENDÁRIO
        // ====================================================================

        function renderizarMes() {


            const ano =
                dataVisualizacao.getFullYear();


            const mes =
                dataVisualizacao.getMonth();



            document.getElementById('mes-titulo').innerText =
                `${mesesNomes[mes]} ${ano}`;



            const container =
                document.getElementById('eventograma');


            container.innerHTML = '';



            const mesDiv =
                document.createElement('div');


            mesDiv.className =
                'mes';



            const grid =
                document.createElement('div');


            grid.className =
                'grid-dias';



            diasSemana.forEach(d => {


                const header =
                    document.createElement('div');


                header.className =
                    'dia-semana';


                header.innerText =
                    d;


                grid.appendChild(header);

            });



            const primeiroDia =
                new Date(
                    ano,
                    mes,
                    1
                ).getDay();



            const diasNoMes =
                new Date(
                    ano,
                    mes + 1,
                    0
                ).getDate();



            let celulasDesenhadas = 0;



            // ================================================================
            // ESPAÇOS ANTES DO PRIMEIRO DIA
            // ================================================================

            for (
                let i = 0;
                i < primeiroDia;
                i++
            ) {


                const vazio =
                    document.createElement('div');


                vazio.className =
                    'dia vazio';


                grid.appendChild(vazio);


                celulasDesenhadas++;

            }



            // ================================================================
            // DIAS
            // ================================================================

            for (
                let dia = 1;
                dia <= diasNoMes;
                dia++
            ) {


                const dataStr =

                    `${ano}-` +

                    `${String(mes + 1).padStart(2, '0')}-` +

                    `${String(dia).padStart(2, '0')}`;



                const diaDiv =
                    document.createElement('div');


                diaDiv.className =
                    'dia';



                // ============================================================
                // CLIQUE NO DIA
                // ============================================================

                diaDiv.onclick =
                    () => abrirDetalhesDia(dataStr);



                const numDiv =
                    document.createElement('div');


                numDiv.className =
                    'numero-dia';


                numDiv.innerText =
                    dia;


                diaDiv.appendChild(numDiv);



                // ============================================================
                // DESTACA O DIA ATUAL
                // ============================================================

                if (

                    ano ===
                        dataAtualReal.getFullYear()

                    &&

                    mes ===
                        dataAtualReal.getMonth()

                    &&

                    dia ===
                        dataAtualReal.getDate()

                ) {

                    diaDiv.classList.add('hoje');

                }



                // ============================================================
                // EVENTOS DO DIA
                // ============================================================

                const eventosDoDia =
                    buscarEventos(dataStr);



                eventosDoDia.forEach(
                    nomeEvento => {


                        const tagEvento =
                            document.createElement('div');


                        tagEvento.className =
                            'tag-evento';


                        tagEvento.innerText =
                            nomeEvento;


                        diaDiv.appendChild(
                            tagEvento
                        );

                    }
                );



                grid.appendChild(
                    diaDiv
                );


                celulasDesenhadas++;

            }



            // ================================================================
            // COMPLETA O GRID
            // ================================================================

            while (
                celulasDesenhadas < 42
            ) {


                const vazio =
                    document.createElement('div');


                vazio.className =
                    'dia vazio';


                grid.appendChild(vazio);


                celulasDesenhadas++;

            }



            mesDiv.appendChild(grid);


            container.appendChild(
                mesDiv
            );

        }



        // ====================================================================
        // BUSCA APENAS OS NOMES PARA MOSTRAR NO CALENDÁRIO
        // ====================================================================

        function buscarEventos(dataBase) {


            let nomes = [];


            eventos.forEach(ev => {


                if (
                    ev.data === dataBase
                ) {

                    nomes.push(
                        ev.nome
                    );

                }


                else if (
                    ev.inicio &&
                    ev.fim
                ) {


                    if (

                        dataBase >= ev.inicio

                        &&

                        dataBase <= ev.fim

                    ) {

                        nomes.push(
                            ev.nome
                        );

                    }

                }

            });


            return nomes;

        }



        // ====================================================================
        // BUSCA EVENTOS COMPLETOS
        // NOME + DESCRIÇÃO
        // ====================================================================

        function buscarEventosCompletos(dataBase) {


            return eventos.filter(ev => {


                if (
                    ev.data === dataBase
                ) {

                    return true;

                }


                if (
                    ev.inicio &&
                    ev.fim
                ) {

                    return (

                        dataBase >= ev.inicio

                        &&

                        dataBase <= ev.fim

                    );

                }


                return false;

            });

        }



        // ====================================================================
        // ABRE DESCRITIVO DO DIA
        // ====================================================================

        function abrirDetalhesDia(dataStr) {


            const [
                ano,
                mes,
                dia
            ] = dataStr.split('-');



            const dataFormatada =
                `${dia}/${mes}/${ano}`;



            document.getElementById(
                'modal-data'
            ).innerText =
                dataFormatada;



            const areaDescricao =
                document.getElementById(
                    'modal-descricao'
                );


            areaDescricao.innerHTML = '';



            const eventosDoDia =
                buscarEventosCompletos(
                    dataStr
                );



            // ================================================================
            // DIA SEM EVENTOS
            // ================================================================

            if (
                eventosDoDia.length === 0
            ) {


                const mensagem =
                    document.createElement('div');


                mensagem.className =
                    'modal-sem-evento';


                mensagem.innerText =
                    'Nenhum evento ou informação cadastrada para este dia.';


                areaDescricao.appendChild(
                    mensagem
                );

            }


            // ================================================================
            // DIA COM EVENTOS
            // ================================================================

            else {


                eventosDoDia.forEach(ev => {


                    const bloco =
                        document.createElement('div');


                    bloco.className =
                        'modal-evento';



                    const titulo =
                        document.createElement('strong');


                    titulo.innerText =
                        ev.nome;


                    bloco.appendChild(
                        titulo
                    );



                    if (
                        ev.descricao
                    ) {


                        const descricao =
                            document.createElement('p');


                        descricao.innerText =
                            ev.descricao;


                        bloco.appendChild(
                            descricao
                        );

                    }


                    areaDescricao.appendChild(
                        bloco
                    );

                });

            }



            document.getElementById(
                'modal-dia'
            ).style.display =
                'flex';

        }



        // ====================================================================
        // FECHAR MODAL
        // ====================================================================

        function fecharModal(event) {


            const modal =
                document.getElementById(
                    'modal-dia'
                );


            if (

                !event

                ||

                event.target === modal

                ||

                event.target.classList.contains(
                    'modal-fechar'
                )

            ) {

                modal.style.display =
                    'none';

            }

        }



        // ====================================================================
        // ALTERAR MÊS
        // ====================================================================

        function mudarMes(direcao) {


            dataVisualizacao.setMonth(

                dataVisualizacao.getMonth()
                + direcao

            );


            renderizarMes();

        }



        // ====================================================================
        // VOLTAR PARA O MÊS ATUAL
        // ====================================================================

        function irParaHoje() {


            dataVisualizacao =
                new Date();


            renderizarMes();

        }



        // ====================================================================
        // FECHAR COM ESC
        // ====================================================================

        document.addEventListener(
            'keydown',
            function(event) {


                if (
                    event.key === 'Escape'
                ) {

                    document.getElementById(
                        'modal-dia'
                    ).style.display =
                        'none';

                }

            }
        );



        // ====================================================================
        // INICIAR
        // ====================================================================

        renderizarMes();


    </script>

</body>
</html>
