<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventograma</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --cor-card: #ffffff;
            --cor-texto: #333333;
            --cor-titulo: #2c3e50;
            --cor-evento: #3498db;
            --cor-evento-texto: #ffffff;
            --cor-hoje-borda: #e74c3c;
            --cor-hoje-fundo: #fadbd8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            color: var(--cor-texto);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* =========================================================
           CONTROLES DO MÊS
           ========================================================= */

        .controles {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 1000px;
        }

        .controles button {
            background-color: transparent;
            border: none;
            font-size: 26px;
            color: var(--cor-titulo);
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .controles button:hover {
            background-color: #e2e6e9;
        }

        #mes-titulo {
            font-size: 22px;
            font-weight: bold;
            color: var(--cor-titulo);
            text-transform: capitalize;
            min-width: 200px;
            text-align: center;
            margin: 0;
        }

        /* =========================================================
           CALENDÁRIO
           ========================================================= */

        #eventograma {
            width: 100%;
            max-width: 1000px;
        }

        .mes {
            background: var(--cor-card);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
        }

        .grid-dias {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .dia-semana {
            font-weight: bold;
            font-size: 0.9em;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 2px solid #ecf0f1;
        }

        .dia {
            border-radius: 6px;
            background-color: #f9f9f9;
            border: 1px solid #eaeaea;
            height: 85px;
            display: flex;
            flex-direction: column;
            padding: 6px;
            transition: background-color 0.2s;
            overflow-y: auto;
        }

        .dia:not(.vazio) {
            cursor: pointer;
        }

        .dia.vazio {
            background-color: transparent;
            border: 1px solid transparent;
            pointer-events: none;
        }

        .dia::-webkit-scrollbar {
            width: 4px;
        }

        .dia::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .dia:not(.vazio):hover {
            background-color: #f1f2f6;
        }

        .numero-dia {
            align-self: flex-end;
            font-size: 0.9em;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 4px;
        }

        /* =========================================================
           DIA ATUAL
           ========================================================= */

        .dia.hoje {
            background-color: var(--cor-hoje-fundo);
            border: 2px solid var(--cor-hoje-borda);
        }

        .dia.hoje .numero-dia {
            color: var(--cor-hoje-borda);
        }

        /* =========================================================
           EVENTOS
           ========================================================= */

        .tag-evento {
            background-color: var(--cor-evento);
            color: var(--cor-evento-texto);
            font-size: 0.7em;
            font-weight: 500;
            padding: 3px 6px;
            border-radius: 4px;
            margin-bottom: 3px;
            word-wrap: break-word;
            line-height: 1.2;
        }

        /* =========================================================
           BOTÃO VOLTAR PARA O MÊS ATUAL
           ========================================================= */

        .btn-hoje {
            margin-top: 15px;
            background-color: var(--cor-titulo);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .btn-hoje:hover {
            background-color: #1a252f;
        }

        /* =========================================================
           MODAL DOS DETALHES DO DIA
           ========================================================= */

        .modal-dia {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.35);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-conteudo {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.18);
            position: relative;
        }

        .modal-conteudo h3 {
            color: var(--cor-titulo);
            margin: 0 30px 15px 0;
        }

        .modal-fechar {
            position: absolute;
            right: 15px;
            top: 10px;
            border: none;
            background: transparent;
            font-size: 26px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .modal-evento {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
        }

        .modal-evento:first-child {
            border-top: none;
            padding-top: 0;
        }

        .modal-evento strong {
            color: var(--cor-titulo);
            display: block;
        }

        .modal-evento p {
            margin: 6px 0 0;
            line-height: 1.5;
            color: var(--cor-texto);
        }

        .modal-periodo {
            font-size: 13px;
            color: #7f8c8d !important;
        }

        .modal-sem-evento {
            color: #7f8c8d;
        }

        /* =========================================================
           RESPONSIVIDADE
           ========================================================= */

        @media (max-width: 650px) {

            .dia {
                height: 75px;
                padding: 4px;
            }

            .tag-evento {
                font-size: 0.62em;
            }

            #mes-titulo {
                font-size: 19px;
                min-width: 160px;
            }

            .controles {
                gap: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         NAVEGAÇÃO ENTRE OS MESES
         ========================================================= -->

    <div class="controles">

        <button
            onclick="mudarMes(-1)"
            title="Mês anterior"
        >
            &#10094;
        </button>

        <h2 id="mes-titulo">
            Mês Ano
        </h2>

        <button
            onclick="mudarMes(1)"
            title="Próximo mês"
        >
            &#10095;
        </button>

    </div>


    <!-- =========================================================
         CALENDÁRIO
         ========================================================= -->

    <div id="eventograma"></div>


    <button
        class="btn-hoje"
        onclick="irParaHoje()"
    >
        Voltar para o Mês Atual
    </button>


    <!-- =========================================================
         JANELA COM OS DETALHES DO DIA
         ========================================================= -->

    <div
        id="modal-dia"
        class="modal-dia"
        onclick="fecharModal(event)"
    >

        <div class="modal-conteudo">

            <button
                class="modal-fechar"
                onclick="fecharModal()"
                title="Fechar"
            >
                ×
            </button>

            <h3 id="modal-data"></h3>

            <div id="modal-descricao"></div>

        </div>

    </div>


    <script>

        // ================================================================
        // ================================================================
        //
        //                 CADASTRO DOS EVENTOS
        //
        // ================================================================
        //
        //              EDITE SOMENTE ESTA ÁREA
        //
        // ================================================================
        //
        // Para adicionar um novo evento, copie um dos modelos abaixo.
        //
        //
        // EVENTO DE UM ÚNICO DIA:
        //
        // {
        //     dataInicio: "2026-08-27",
        //     dataFim: "",
        //     titulo: "Nome do evento",
        //     descricao: "Descrição do evento."
        // },
        //
        //
        // EVENTO DE VÁRIOS DIAS:
        //
        // {
        //     dataInicio: "2026-08-20",
        //     dataFim: "2026-08-22",
        //     titulo: "Nome do evento",
        //     descricao: "Descrição do evento."
        // },
        //
        //
        // IMPORTANTE:
        //
        // As datas devem seguir o formato:
        //
        // AAAA-MM-DD
        //
        // Exemplo:
        //
        // 27 de agosto de 2026 = 2026-08-27
        //
        // ================================================================
        // ================================================================


        const eventos = [

            {
                dataInicio: "2026-08-27",
                dataFim: "",
                titulo: "Dia da Mopa",
                descricao: "Descritivo completo sobre o Dia da Mopa."
            },

            {
                dataInicio: "2026-08-20",
                dataFim: "2026-08-22",
                titulo: "Semana da Mopa",
                descricao: "Durante esses dias serão realizadas atividades relacionadas à Semana da Mopa."
            },

            {
                dataInicio: "2026-10-12",
                dataFim: "2026-10-16",
                titulo: "Semana Interna de Treinamento",
                descricao: "Semana destinada às capacitações e treinamentos internos."
            },

            {
                dataInicio: "2026-12-25",
                dataFim: "",
                titulo: "Natal",
                descricao: "Feriado de Natal."
            },

            {
                dataInicio: "2026-05-12",
                dataFim: "",
                titulo: "Aniversário de Juan",
                descricao: "Aniversário de Juan."
            }

            /*
            ================================================================
            NOVO EVENTO

            Para cadastrar outro evento, coloque uma vírgula depois do
            evento anterior e copie este modelo:


            ,

            {
                dataInicio: "2026-09-10",
                dataFim: "",
                titulo: "Nome do evento",
                descricao: "Digite aqui o descritivo do evento."
            }


            Se for um período:


            ,

            {
                dataInicio: "2026-09-10",
                dataFim: "2026-09-12",
                titulo: "Nome do evento",
                descricao: "Digite aqui o descritivo do evento."
            }

            ================================================================
            */

        ];


        // ================================================================
        // FIM DA ÁREA DE CADASTRO
        // NÃO É NECESSÁRIO ALTERAR O CÓDIGO ABAIXO
        // ================================================================



        const dataAtualReal =
            new Date();


        let dataVisualizacao =
            new Date();


        const mesesNomes = [

            "Janeiro",
            "Fevereiro",
            "Março",
            "Abril",
            "Maio",
            "Junho",
            "Julho",
            "Agosto",
            "Setembro",
            "Outubro",
            "Novembro",
            "Dezembro"

        ];


        const diasSemana = [

            "Dom",
            "Seg",
            "Ter",
            "Qua",
            "Qui",
            "Sex",
            "Sáb"

        ];


        // ================================================================
        // VERIFICA SE O EVENTO ESTÁ NA DATA
        // ================================================================

        function eventoOcorreNoDia(
            evento,
            dataBase
        ) {

            // Evento de apenas um dia

            if (
                !evento.dataFim
            ) {

                return (
                    evento.dataInicio ===
                    dataBase
                );

            }


            // Evento com período

            return (

                dataBase >= evento.dataInicio

                &&

                dataBase <= evento.dataFim

            );

        }


        // ================================================================
        // BUSCA EVENTOS DO DIA
        // ================================================================

        function buscarEventos(
            dataBase
        ) {

            return eventos.filter(
                evento =>
                    eventoOcorreNoDia(
                        evento,
                        dataBase
                    )
            );

        }


        // ================================================================
        // RENDERIZA O CALENDÁRIO
        // ================================================================

        function renderizarMes() {

            const ano =
                dataVisualizacao.getFullYear();


            const mes =
                dataVisualizacao.getMonth();


            document.getElementById(
                'mes-titulo'
            ).innerText =
                `${mesesNomes[mes]} ${ano}`;


            const container =
                document.getElementById(
                    'eventograma'
                );


            container.innerHTML =
                '';


            const mesDiv =
                document.createElement(
                    'div'
                );


            mesDiv.className =
                'mes';


            const grid =
                document.createElement(
                    'div'
                );


            grid.className =
                'grid-dias';


            // ============================================================
            // CABEÇALHO DOS DIAS DA SEMANA
            // ============================================================

            diasSemana.forEach(
                diaSemana => {

                    const header =
                        document.createElement(
                            'div'
                        );


                    header.className =
                        'dia-semana';


                    header.innerText =
                        diaSemana;


                    grid.appendChild(
                        header
                    );

                }
            );


            const primeiroDia =
                new Date(
                    ano,
                    mes,
                    1
                ).getDay();


            const diasNoMes =
                new Date(
                    ano,
                    mes + 1,
                    0
                ).getDate();


            let celulasDesenhadas =
                0;


            // ============================================================
            // ESPAÇOS ANTES DO DIA 1
            // ============================================================

            for (
                let i = 0;
                i < primeiroDia;
                i++
            ) {

                const vazio =
                    document.createElement(
                        'div'
                    );


                vazio.className =
                    'dia vazio';


                grid.appendChild(
                    vazio
                );


                celulasDesenhadas++;

            }


            // ============================================================
            // CRIA OS DIAS
            // ============================================================

            for (
                let dia = 1;
                dia <= diasNoMes;
                dia++
            ) {

                const dataStr =

                    `${ano}-` +

                    `${String(
                        mes + 1
                    ).padStart(
                        2,
                        '0'
                    )}-` +

                    `${String(
                        dia
                    ).padStart(
                        2,
                        '0'
                    )}`;


                const diaDiv =
                    document.createElement(
                        'div'
                    );


                diaDiv.className =
                    'dia';


                // ========================================================
                // CLICAR NO DIA
                // ========================================================

                diaDiv.onclick =
                    () =>
                        abrirDetalhesDia(
                            dataStr
                        );


                // ========================================================
                // NÚMERO DO DIA
                // ========================================================

                const numDiv =
                    document.createElement(
                        'div'
                    );


                numDiv.className =
                    'numero-dia';


                numDiv.innerText =
                    dia;


                diaDiv.appendChild(
                    numDiv
                );


                // ========================================================
                // DESTACA O DIA ATUAL
                // ========================================================

                if (

                    ano ===
                        dataAtualReal.getFullYear()

                    &&

                    mes ===
                        dataAtualReal.getMonth()

                    &&

                    dia ===
                        dataAtualReal.getDate()

                ) {

                    diaDiv.classList.add(
                        'hoje'
                    );

                }


                // ========================================================
                // EVENTOS DO DIA
                // ========================================================

                const eventosDoDia =
                    buscarEventos(
                        dataStr
                    );


                eventosDoDia.forEach(
                    evento => {

                        const tagEvento =
                            document.createElement(
                                'div'
                            );


                        tagEvento.className =
                            'tag-evento';


                        tagEvento.innerText =
                            evento.titulo;


                        diaDiv.appendChild(
                            tagEvento
                        );

                    }
                );


                grid.appendChild(
                    diaDiv
                );


                celulasDesenhadas++;

            }


            // ============================================================
            // COMPLETA A GRADE COM ESPAÇOS VAZIOS
            // ============================================================

            while (
                celulasDesenhadas < 42
            ) {

                const vazio =
                    document.createElement(
                        'div'
                    );


                vazio.className =
                    'dia vazio';


                grid.appendChild(
                    vazio
                );


                celulasDesenhadas++;

            }


            mesDiv.appendChild(
                grid
            );


            container.appendChild(
                mesDiv
            );

        }


        // ================================================================
        // ABRIR DETALHES DO DIA
        // ================================================================

        function abrirDetalhesDia(
            dataStr
        ) {

            const [
                ano,
                mes,
                dia
            ] =
                dataStr.split(
                    '-'
                );


            const dataFormatada =
                `${dia}/${mes}/${ano}`;


            document.getElementById(
                'modal-data'
            ).innerText =
                dataFormatada;


            const areaDescricao =
                document.getElementById(
                    'modal-descricao'
                );


            areaDescricao.innerHTML =
                '';


            const eventosDoDia =
                buscarEventos(
                    dataStr
                );


            // ============================================================
            // DIA SEM EVENTOS
            // ============================================================

            if (
                eventosDoDia.length === 0
            ) {

                const mensagem =
                    document.createElement(
                        'div'
                    );


                mensagem.className =
                    'modal-sem-evento';


                mensagem.innerText =
                    'Nenhum evento ou informação cadastrada para este dia.';


                areaDescricao.appendChild(
                    mensagem
                );

            }


            // ============================================================
            // DIA COM EVENTOS
            // ============================================================

            else {

                eventosDoDia.forEach(
                    evento => {

                        const bloco =
                            document.createElement(
                                'div'
                            );


                        bloco.className =
                            'modal-evento';


                        // ================================================
                        // TÍTULO
                        // ================================================

                        const titulo =
                            document.createElement(
                                'strong'
                            );


                        titulo.innerText =
                            evento.titulo;


                        bloco.appendChild(
                            titulo
                        );


                        // ================================================
                        // PERÍODO
                        // ================================================

                        if (
                            evento.dataFim
                        ) {

                            const periodo =
                                document.createElement(
                                    'p'
                                );


                            periodo.className =
                                'modal-periodo';


                            periodo.innerText =
                                `Período: ${formatarData(evento.dataInicio)} a ${formatarData(evento.dataFim)}`;


                            bloco.appendChild(
                                periodo
                            );

                        }


                        // ================================================
                        // DESCRIÇÃO
                        // ================================================

                        if (
                            evento.descricao
                        ) {

                            const descricao =
                                document.createElement(
                                    'p'
                                );


                            descricao.innerText =
                                evento.descricao;


                            bloco.appendChild(
                                descricao
                            );

                        }


                        areaDescricao.appendChild(
                            bloco
                        );

                    }
                );

            }


            document.getElementById(
                'modal-dia'
            ).style.display =
                'flex';

        }


        // ================================================================
        // FORMATAR DATA
        // ================================================================

        function formatarData(
            data
        ) {

            if (
                !data
            ) {

                return '';

            }


            const [
                ano,
                mes,
                dia
            ] =
                data.split(
                    '-'
                );


            return `${dia}/${mes}/${ano}`;

        }


        // ================================================================
        // FECHAR MODAL
        // ================================================================

        function fecharModal(
            event
        ) {

            const modal =
                document.getElementById(
                    'modal-dia'
                );


            if (

                !event

                ||

                event.target === modal

                ||

                event.target.classList.contains(
                    'modal-fechar'
                )

            ) {

                modal.style.display =
                    'none';

            }

        }


        // ================================================================
        // MÊS ANTERIOR / PRÓXIMO MÊS
        // ================================================================

        function mudarMes(
            direcao
        ) {

            dataVisualizacao.setMonth(

                dataVisualizacao.getMonth()
                +
                direcao

            );


            renderizarMes();

        }


        // ================================================================
        // VOLTAR PARA O MÊS ATUAL
        // ================================================================

        function irParaHoje() {

            dataVisualizacao =
                new Date();


            renderizarMes();

        }


        // ================================================================
        // FECHAR A JANELA COM ESC
        // ================================================================

        document.addEventListener(
            'keydown',
            function(event) {

                if (
                    event.key ===
                    'Escape'
                ) {

                    document.getElementById(
                        'modal-dia'
                    ).style.display =
                        'none';

                }

            }
        );


        // ================================================================
        // INICIALIZAÇÃO
        // ================================================================

        renderizarMes();

    </script>

</body>
</html>
