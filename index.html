<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventograma</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --cor-card: #ffffff;
            --cor-texto: #333333;
            --cor-titulo: #2c3e50;

            --cor-reuniao: #3498db;
            --cor-evento: #27ae60;
            --cor-comemorativa: #8e44ad;
            --cor-feriado: #e74c3c;

            --cor-evento-texto: #ffffff;

            --cor-hoje-borda: #e74c3c;
            --cor-hoje-fundo: #fadbd8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            color: var(--cor-texto);
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }


        /* =========================================================
           CONTROLES DO MÊS
           ========================================================= */

        .controles {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 6px;
            width: 100%;
            max-width: 1000px;
        }

        .controles button {
            background-color: transparent;
            border: none;
            font-size: 26px;
            color: var(--cor-titulo);
            cursor: pointer;
            padding: 4px 15px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .controles button:hover {
            background-color: #e2e6e9;
        }

        #mes-titulo {
            font-size: 21px;
            font-weight: bold;
            color: var(--cor-titulo);
            text-transform: capitalize;
            min-width: 200px;
            text-align: center;
            margin: 0;
        }


        /* =========================================================
           LEGENDA
           ========================================================= */

        .legenda-categorias {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #5d6d7e;
        }

        .legenda-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legenda-cor {
            width: 11px;
            height: 11px;
            border-radius: 3px;
            display: inline-block;
        }

        .legenda-cor.reuniao {
            background-color: var(--cor-reuniao);
        }

        .legenda-cor.evento {
            background-color: var(--cor-evento);
        }

        .legenda-cor.comemorativa {
            background-color: var(--cor-comemorativa);
        }

        .legenda-cor.feriado {
            background-color: var(--cor-feriado);
        }


        /* =========================================================
           SELETOR DE VISUALIZAÇÃO
           ========================================================= */

        .seletor-visualizacao {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-bottom: 8px;
            padding: 3px;
            background-color: #f2f4f5;
            border-radius: 8px;
        }

        .btn-visualizacao {
            border: none;
            background-color: transparent;
            color: #6c7a89;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-visualizacao:hover {
            background-color: #e4e8ea;
        }

        .btn-visualizacao.ativo {
            background-color: var(--cor-titulo);
            color: #ffffff;
        }


        /* =========================================================
           ÁREA PRINCIPAL
           ========================================================= */

        #eventograma {
            width: 100%;
            max-width: 1000px;
        }


        /* =========================================================
           CALENDÁRIO
           ========================================================= */

        .mes {
            background: var(--cor-card);
            padding: 11px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
        }

        .grid-dias {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .dia-semana {
            font-weight: bold;
            font-size: 0.85em;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 2px;
            padding-bottom: 4px;
            border-bottom: 2px solid #ecf0f1;
        }

        .dia {
            border-radius: 6px;
            background-color: #f9f9f9;
            border: 1px solid #eaeaea;

            /* ALTURA REDUZIDA */
            height: 72px;

            display: flex;
            flex-direction: column;
            padding: 5px;
            transition: background-color 0.2s;
            overflow-y: auto;

            scrollbar-width: thin;
            scrollbar-color: #bfc5c9 transparent;
        }

        .dia:not(.vazio) {
            cursor: pointer;
        }

        .dia.vazio {
            background-color: transparent;
            border: 1px solid transparent;
            pointer-events: none;
        }

        .dia::-webkit-scrollbar {
            width: 5px;
        }

        .dia::-webkit-scrollbar-track {
            background: transparent;
        }

        .dia::-webkit-scrollbar-thumb {
            background: #bfc5c9;
            border-radius: 5px;
        }

        .dia:not(.vazio):hover {
            background-color: #f1f2f6;
        }

        .numero-dia {
            align-self: flex-end;
            font-size: 0.85em;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 3px;
            flex-shrink: 0;
        }


        /* =========================================================
           DIA ATUAL
           ========================================================= */

        .dia.hoje {
            background-color: var(--cor-hoje-fundo);
            border: 2px solid var(--cor-hoje-borda);
        }

        .dia.hoje .numero-dia {
            color: var(--cor-hoje-borda);
        }


        /* =========================================================
           TAGS DOS EVENTOS
           ========================================================= */

        .tag-evento {
            color: var(--cor-evento-texto);
            font-size: 0.68em;
            font-weight: 500;
            padding: 3px 5px;
            border-radius: 4px;
            margin-bottom: 3px;
            word-wrap: break-word;
            line-height: 1.15;
            flex-shrink: 0;
        }

        .tag-evento.reuniao {
            background-color: var(--cor-reuniao);
        }

        .tag-evento.evento {
            background-color: var(--cor-evento);
        }

        .tag-evento.comemorativa {
            background-color: var(--cor-comemorativa);
        }

        .tag-evento.feriado {
            background-color: var(--cor-feriado);
        }


        /* =========================================================
           LISTA DO MÊS
           ========================================================= */

        .lista-mes {
            background: var(--cor-card);
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
        }

        .grupo-dia-lista {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 18px;
            padding: 16px 0;
            border-bottom: 1px solid #ecf0f1;
        }

        .grupo-dia-lista:first-child {
            padding-top: 2px;
        }

        .grupo-dia-lista:last-child {
            border-bottom: none;
            padding-bottom: 2px;
        }

        .data-lista {
            text-align: center;
        }

        .numero-lista {
            display: block;
            color: var(--cor-titulo);
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
        }

        .mes-lista {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        .semana-lista {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            color: #9aa4aa;
        }

        .eventos-lista-dia {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .evento-lista {
            position: relative;
            padding: 10px 12px 10px 15px;
            background-color: #f9f9f9;
            border-radius: 7px;
            border: 1px solid #eeeeee;
            overflow: hidden;
        }

        .evento-lista::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
        }

        .evento-lista.reuniao::before {
            background-color: var(--cor-reuniao);
        }

        .evento-lista.evento::before {
            background-color: var(--cor-evento);
        }

        .evento-lista.comemorativa::before {
            background-color: var(--cor-comemorativa);
        }

        .evento-lista.feriado::before {
            background-color: var(--cor-feriado);
        }

        .cabecalho-evento-lista {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .titulo-evento-lista {
            color: var(--cor-titulo);
            font-size: 14px;
            font-weight: 600;
        }

        .categoria-lista {
            display: inline-block;
            color: #ffffff;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 7px;
            border-radius: 4px;
        }

        .categoria-lista.reuniao {
            background-color: var(--cor-reuniao);
        }

        .categoria-lista.evento {
            background-color: var(--cor-evento);
        }

        .categoria-lista.comemorativa {
            background-color: var(--cor-comemorativa);
        }

        .categoria-lista.feriado {
            background-color: var(--cor-feriado);
        }

        .periodo-lista {
            margin-top: 6px;
            font-size: 12px;
            color: #7f8c8d;
        }

        .descricao-lista {
            margin: 6px 0 0;
            font-size: 13px;
            line-height: 1.45;
            color: #566573;
        }

        .lista-vazia {
            padding: 30px 10px;
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
        }


        /* =========================================================
           BOTÃO MÊS ATUAL
           ========================================================= */

        .btn-hoje {
            margin-top: 10px;
            background-color: var(--cor-titulo);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .btn-hoje:hover {
            background-color: #1a252f;
        }


        /* =========================================================
           MODAL
           ========================================================= */

        .modal-dia {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.35);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-conteudo {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.18);
            position: relative;
        }

        .modal-conteudo h3 {
            color: var(--cor-titulo);
            margin: 0 30px 15px 0;
        }

        .modal-fechar {
            position: absolute;
            right: 15px;
            top: 10px;
            border: none;
            background: transparent;
            font-size: 26px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .modal-evento {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
        }

        .modal-evento:first-child {
            border-top: none;
            padding-top: 0;
        }

        .modal-evento strong {
            color: var(--cor-titulo);
            display: block;
            margin-bottom: 5px;
        }

        .modal-evento p {
            margin: 6px 0 0;
            line-height: 1.5;
            color: var(--cor-texto);
        }

        .modal-periodo {
            font-size: 13px;
            color: #7f8c8d !important;
        }

        .modal-sem-evento {
            color: #7f8c8d;
        }


        /* =========================================================
           CATEGORIA NO MODAL
           ========================================================= */

        .categoria-modal {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 5px;
            margin-bottom: 4px;
        }

        .categoria-modal.reuniao {
            background-color: var(--cor-reuniao);
        }

        .categoria-modal.evento {
            background-color: var(--cor-evento);
        }

        .categoria-modal.comemorativa {
            background-color: var(--cor-comemorativa);
        }

        .categoria-modal.feriado {
            background-color: var(--cor-feriado);
        }


        /* =========================================================
           RESPONSIVIDADE
           ========================================================= */

        @media (max-width: 650px) {

            .dia {
                height: 65px;
                padding: 4px;
            }

            .tag-evento {
                font-size: 0.60em;
            }

            #mes-titulo {
                font-size: 18px;
                min-width: 155px;
            }

            .controles {
                gap: 5px;
            }

            .legenda-categorias {
                gap: 8px 12px;
                font-size: 11px;
            }

            .grupo-dia-lista {
                grid-template-columns: 60px 1fr;
                gap: 10px;
            }

            .numero-lista {
                font-size: 21px;
            }

            .lista-mes {
                padding: 12px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         NAVEGAÇÃO
         ========================================================= -->

    <div class="controles">

        <button
            onclick="mudarMes(-1)"
            title="Mês anterior"
        >
            &#10094;
        </button>

        <h2 id="mes-titulo">
            Mês Ano
        </h2>

        <button
            onclick="mudarMes(1)"
            title="Próximo mês"
        >
            &#10095;
        </button>

    </div>


    <!-- =========================================================
         LEGENDA
         ========================================================= -->

    <div class="legenda-categorias">

        <div class="legenda-item">
            <span class="legenda-cor reuniao"></span>
            <span>Reunião</span>
        </div>

        <div class="legenda-item">
            <span class="legenda-cor evento"></span>
            <span>Evento</span>
        </div>

        <div class="legenda-item">
            <span class="legenda-cor comemorativa"></span>
            <span>Data comemorativa</span>
        </div>

        <div class="legenda-item">
            <span class="legenda-cor feriado"></span>
            <span>Feriado</span>
        </div>

    </div>


    <!-- =========================================================
         SELETOR DE VISUALIZAÇÃO
         ========================================================= -->

    <div class="seletor-visualizacao">

        <button
            id="btn-calendario"
            class="btn-visualizacao ativo"
            onclick="alterarVisualizacao('calendario')"
        >
            Calendário
        </button>

        <button
            id="btn-lista"
            class="btn-visualizacao"
            onclick="alterarVisualizacao('lista')"
        >
            Lista do mês
        </button>

    </div>


    <!-- =========================================================
         ÁREA PRINCIPAL
         ========================================================= -->

    <div id="eventograma"></div>


    <button
        class="btn-hoje"
        onclick="irParaHoje()"
    >
        Voltar para o Mês Atual
    </button>


    <!-- =========================================================
         MODAL
         ========================================================= -->

    <div
        id="modal-dia"
        class="modal-dia"
        onclick="fecharModal(event)"
    >

        <div class="modal-conteudo">

            <button
                class="modal-fechar"
                onclick="fecharModal()"
                title="Fechar"
            >
                ×
            </button>

            <h3 id="modal-data"></h3>

            <div id="modal-descricao"></div>

        </div>

    </div>


    <script>


        // ================================================================
        // ================================================================
        //
        //                 CADASTRO DOS EVENTOS
        //
        // ================================================================
        //
        //              EDITE SOMENTE ESTA ÁREA
        //
        // ================================================================
        //
        // CATEGORIAS DISPONÍVEIS:
        //
        // "reuniao"
        // "evento"
        // "comemorativa"
        // "feriado"
        //
        //
        // EVENTO DE UM DIA:
        //
        // {
        //     dataInicio: "AAAA-MM-DD",
        //     dataFim: "",
        //     titulo: "Nome",
        //     descricao: "Descrição",
        //     categoria: "reuniao"
        // },
        //
        //
        // EVENTO COM VÁRIOS DIAS:
        //
        // {
        //     dataInicio: "AAAA-MM-DD",
        //     dataFim: "AAAA-MM-DD",
        //     titulo: "Nome",
        //     descricao: "Descrição",
        //     categoria: "evento"
        // },
        //
        // ================================================================


        const eventos = [

            {
                dataInicio: "2026-08-28",
                dataFim: "2026-08-28",
                titulo: "Retorno do PGV",
                descricao: "Retorno do Programa de Gestão Funcional.",
                categoria: "reuniao"
            },

            {
                dataInicio: "2026-08-10",
                dataFim: "",
                titulo: "Dia dos Cursos Jurídicos",
                descricao: "Remanejamento do Feriado do dia 11 de agosto - Dia dos Cursos Jurídicos",
                categoria: "feriado"
            },

            {
                dataInicio: "2026-08-09",
                dataFim: "",
                titulo: "Dia dos Pais",
                descricao: "Comemoração dos Dia dos Pais",
                categoria: "comemorativa"
            },

            {
                dataInicio: "2026-08-06",
                dataFim: "2026-08-06",
                titulo: "Dia Nacional dos Profissionais de Educação",
                descricao: "Comemoração em homenagem aos Profissionais de Educação",
                categoria: "comemorativa"
            },

            {
                dataInicio: "2026-09-07",
                dataFim: "",
                titulo: "Independência do Brasil",
                descricao: "Feriado Nacional da Independência do Brasil",
                categoria: "feriado"
            },

            {
                dataInicio: "2026-10-12",
                dataFim: "",
                titulo: "Nossa Senhora Aparecida",
                descricao: "Feriado nacional.",
                categoria: "feriado"
            },

            {
                dataInicio: "2026-12-25",
                dataFim: "",
                titulo: "Natal",
                descricao: "Feriado de Natal.",
                categoria: "feriado"
            },

            {
                dataInicio: "2026-09-25",
                dataFim: "",
                titulo: "PGV - 2° Encontro (Fase 2)",
                descricao: "Segundo encontro da fase 2 dO PGV",
                categoria: "reuniao"
            }
            {
                dataInicio: "2026-09-30",
                dataFim: "",
                titulo: " 3 Trivesário",
                descricao: "Comemoração dos Aniversariantes do 3° Trimetre",
                categoria: "evento"
            }
        ];


        // ================================================================
        // FIM DA ÁREA DE CADASTRO
        // ================================================================


        const dataAtualReal =
            new Date();


        let dataVisualizacao =
            new Date();


        let visualizacaoAtual =
            "calendario";


        const mesesNomes = [

            "Janeiro",
            "Fevereiro",
            "Março",
            "Abril",
            "Maio",
            "Junho",
            "Julho",
            "Agosto",
            "Setembro",
            "Outubro",
            "Novembro",
            "Dezembro"

        ];


        const mesesAbreviados = [

            "JAN",
            "FEV",
            "MAR",
            "ABR",
            "MAI",
            "JUN",
            "JUL",
            "AGO",
            "SET",
            "OUT",
            "NOV",
            "DEZ"

        ];


        const diasSemana = [

            "Dom",
            "Seg",
            "Ter",
            "Qua",
            "Qui",
            "Sex",
            "Sáb"

        ];


        const diasSemanaCompleto = [

            "domingo",
            "segunda-feira",
            "terça-feira",
            "quarta-feira",
            "quinta-feira",
            "sexta-feira",
            "sábado"

        ];


        const nomesCategorias = {

            reuniao: "Reunião",

            evento: "Evento",

            comemorativa: "Data comemorativa",

            feriado: "Feriado"

        };


        // ================================================================
        // EVENTO OCORRE NO DIA?
        // ================================================================

        function eventoOcorreNoDia(
            evento,
            dataBase
        ) {

            if (!evento.dataFim) {

                return (
                    evento.dataInicio === dataBase
                );

            }


            return (

                dataBase >= evento.dataInicio

                &&

                dataBase <= evento.dataFim

            );

        }


        // ================================================================
        // BUSCAR EVENTOS DO DIA
        // ================================================================

        function buscarEventos(
            dataBase
        ) {

            return eventos.filter(

                evento =>

                    eventoOcorreNoDia(
                        evento,
                        dataBase
                    )

            );

        }


        // ================================================================
        // VERIFICA SE O EVENTO PERTENCE AO MÊS
        // ================================================================

        function eventoPertenceAoMes(
            evento,
            ano,
            mes
        ) {

            const primeiroDiaMes =

                `${ano}-${String(
                    mes + 1
                ).padStart(
                    2,
                    '0'
                )}-01`;


            const ultimoDiaNumero =

                new Date(
                    ano,
                    mes + 1,
                    0
                ).getDate();


            const ultimoDiaMes =

                `${ano}-${String(
                    mes + 1
                ).padStart(
                    2,
                    '0'
                )}-${String(
                    ultimoDiaNumero
                ).padStart(
                    2,
                    '0'
                )}`;


            const fimEvento =

                evento.dataFim
                    ? evento.dataFim
                    : evento.dataInicio;


            return (

                evento.dataInicio <= ultimoDiaMes

                &&

                fimEvento >= primeiroDiaMes

            );

        }


        // ================================================================
        // DATA DE ORDENAÇÃO NA LISTA
        // ================================================================

        function obterDataOrdenacao(
            evento,
            ano,
            mes
        ) {

            const inicioMes =

                `${ano}-${String(
                    mes + 1
                ).padStart(
                    2,
                    '0'
                )}-01`;


            if (
                evento.dataInicio <
                inicioMes
            ) {

                return inicioMes;

            }


            return evento.dataInicio;

        }


        // ================================================================
        // ALTERAR VISUALIZAÇÃO
        // ================================================================

        function alterarVisualizacao(
            modo
        ) {

            visualizacaoAtual =
                modo;


            document.getElementById(
                'btn-calendario'
            ).classList.toggle(

                'ativo',

                modo === 'calendario'

            );


            document.getElementById(
                'btn-lista'
            ).classList.toggle(

                'ativo',

                modo === 'lista'

            );


            renderizarVisualizacao();

        }


        // ================================================================
        // ESCOLHE A VISUALIZAÇÃO
        // ================================================================

        function renderizarVisualizacao() {

            const ano =
                dataVisualizacao.getFullYear();


            const mes =
                dataVisualizacao.getMonth();


            document.getElementById(
                'mes-titulo'
            ).innerText =

                `${mesesNomes[mes]} ${ano}`;


            if (
                visualizacaoAtual ===
                'lista'
            ) {

                renderizarListaMes();

            }

            else {

                renderizarMes();

            }

        }


        // ================================================================
        // RENDERIZAR CALENDÁRIO
        // ================================================================

        function renderizarMes() {

            const ano =
                dataVisualizacao.getFullYear();


            const mes =
                dataVisualizacao.getMonth();


            const container =
                document.getElementById(
                    'eventograma'
                );


            container.innerHTML =
                '';


            const mesDiv =
                document.createElement(
                    'div'
                );


            mesDiv.className =
                'mes';


            const grid =
                document.createElement(
                    'div'
                );


            grid.className =
                'grid-dias';


            // ============================================================
            // CABEÇALHO
            // ============================================================

            diasSemana.forEach(

                diaSemana => {

                    const header =
                        document.createElement(
                            'div'
                        );


                    header.className =
                        'dia-semana';


                    header.innerText =
                        diaSemana;


                    grid.appendChild(
                        header
                    );

                }

            );


            const primeiroDia =

                new Date(
                    ano,
                    mes,
                    1
                ).getDay();


            const diasNoMes =

                new Date(
                    ano,
                    mes + 1,
                    0
                ).getDate();


            let celulasDesenhadas =
                0;


            // ============================================================
            // ESPAÇOS ANTES DO PRIMEIRO DIA
            // ============================================================

            for (
                let i = 0;
                i < primeiroDia;
                i++
            ) {

                const vazio =
                    document.createElement(
                        'div'
                    );


                vazio.className =
                    'dia vazio';


                grid.appendChild(
                    vazio
                );


                celulasDesenhadas++;

            }


            // ============================================================
            // DIAS DO MÊS
            // ============================================================

            for (
                let dia = 1;
                dia <= diasNoMes;
                dia++
            ) {

                const dataStr =

                    `${ano}-` +

                    `${String(
                        mes + 1
                    ).padStart(
                        2,
                        '0'
                    )}-` +

                    `${String(
                        dia
                    ).padStart(
                        2,
                        '0'
                    )}`;


                const diaDiv =
                    document.createElement(
                        'div'
                    );


                diaDiv.className =
                    'dia';


                diaDiv.onclick =
                    () =>
                        abrirDetalhesDia(
                            dataStr
                        );


                const numDiv =
                    document.createElement(
                        'div'
                    );


                numDiv.className =
                    'numero-dia';


                numDiv.innerText =
                    dia;


                diaDiv.appendChild(
                    numDiv
                );


                // ========================================================
                // DIA ATUAL
                // ========================================================

                if (

                    ano === dataAtualReal.getFullYear()

                    &&

                    mes === dataAtualReal.getMonth()

                    &&

                    dia === dataAtualReal.getDate()

                ) {

                    diaDiv.classList.add(
                        'hoje'
                    );

                }


                // ========================================================
                // EVENTOS
                // ========================================================

                const eventosDoDia =
                    buscarEventos(
                        dataStr
                    );


                eventosDoDia.forEach(

                    evento => {

                        const tagEvento =
                            document.createElement(
                                'div'
                            );


                        tagEvento.className =

                            `tag-evento ${evento.categoria}`;


                        tagEvento.innerText =
                            evento.titulo;


                        diaDiv.appendChild(
                            tagEvento
                        );

                    }

                );


                grid.appendChild(
                    diaDiv
                );


                celulasDesenhadas++;

            }


            // ============================================================
            // COMPLETAR GRADE
            // ============================================================

            while (
                celulasDesenhadas < 42
            ) {

                const vazio =
                    document.createElement(
                        'div'
                    );


                vazio.className =
                    'dia vazio';


                grid.appendChild(
                    vazio
                );


                celulasDesenhadas++;

            }


            mesDiv.appendChild(
                grid
            );


            container.appendChild(
                mesDiv
            );

        }


        // ================================================================
        // RENDERIZAR LISTA DO MÊS
        // ================================================================

        function renderizarListaMes() {

            const ano =
                dataVisualizacao.getFullYear();


            const mes =
                dataVisualizacao.getMonth();


            const container =
                document.getElementById(
                    'eventograma'
                );


            container.innerHTML =
                '';


            const listaDiv =
                document.createElement(
                    'div'
                );


            listaDiv.className =
                'lista-mes';


            // ============================================================
            // FILTRAR EVENTOS
            // ============================================================

            const eventosDoMes =

                eventos

                    .filter(

                        evento =>

                            eventoPertenceAoMes(
                                evento,
                                ano,
                                mes
                            )

                    )

                    .map(

                        evento => ({

                            ...evento,

                            dataOrdenacao:
                                obterDataOrdenacao(
                                    evento,
                                    ano,
                                    mes
                                )

                        })

                    )

                    .sort(

                        (a, b) =>

                            a.dataOrdenacao.localeCompare(
                                b.dataOrdenacao
                            )

                    );


            // ============================================================
            // LISTA VAZIA
            // ============================================================

            if (
                eventosDoMes.length === 0
            ) {

                const vazio =
                    document.createElement(
                        'div'
                    );


                vazio.className =
                    'lista-vazia';


                vazio.innerText =

                    'Nenhuma programação cadastrada para este mês.';


                listaDiv.appendChild(
                    vazio
                );


                container.appendChild(
                    listaDiv
                );


                return;

            }


            // ============================================================
            // AGRUPAR POR DATA
            // ============================================================

            const grupos = {};


            eventosDoMes.forEach(

                evento => {

                    const chave =
                        evento.dataOrdenacao;


                    if (
                        !grupos[chave]
                    ) {

                        grupos[chave] =
                            [];

                    }


                    grupos[chave].push(
                        evento
                    );

                }

            );


            // ============================================================
            // CRIAR GRUPOS
            // ============================================================

            Object.keys(
                grupos
            )

                .sort()

                .forEach(

                    dataGrupo => {

                        const grupo =
                            document.createElement(
                                'div'
                            );


                        grupo.className =
                            'grupo-dia-lista';


                        const [
                            anoData,
                            mesData,
                            diaData
                        ] =
                            dataGrupo.split(
                                '-'
                            );


                        const dataObjeto =
                            criarDataLocal(
                                dataGrupo
                            );


                        const colunaData =
                            document.createElement(
                                'div'
                            );


                        colunaData.className =
                            'data-lista';


                        const numero =
                            document.createElement(
                                'span'
                            );


                        numero.className =
                            'numero-lista';


                        numero.innerText =
                            Number(
                                diaData
                            );


                        const mesTexto =
                            document.createElement(
                                'span'
                            );


                        mesTexto.className =
                            'mes-lista';


                        mesTexto.innerText =

                            mesesAbreviados[
                                Number(
                                    mesData
                                ) - 1
                            ];


                        const semana =
                            document.createElement(
                                'span'
                            );


                        semana.className =
                            'semana-lista';


                        semana.innerText =

                            diasSemanaCompleto[
                                dataObjeto.getDay()
                            ];


                        colunaData.appendChild(
                            numero
                        );


                        colunaData.appendChild(
                            mesTexto
                        );


                        colunaData.appendChild(
                            semana
                        );


                        grupo.appendChild(
                            colunaData
                        );


                        // =================================================
                        // EVENTOS DO DIA
                        // =================================================

                        const areaEventos =
                            document.createElement(
                                'div'
                            );


                        areaEventos.className =
                            'eventos-lista-dia';


                        grupos[
                            dataGrupo
                        ].forEach(

                            evento => {

                                const item =
                                    document.createElement(
                                        'div'
                                    );


                                item.className =

                                    `evento-lista ${evento.categoria}`;


                                const cabecalho =
                                    document.createElement(
                                        'div'
                                    );


                                cabecalho.className =
                                    'cabecalho-evento-lista';


                                const titulo =
                                    document.createElement(
                                        'span'
                                    );


                                titulo.className =
                                    'titulo-evento-lista';


                                titulo.innerText =
                                    evento.titulo;


                                const categoria =
                                    document.createElement(
                                        'span'
                                    );


                                categoria.className =

                                    `categoria-lista ${evento.categoria}`;


                                categoria.innerText =

                                    nomesCategorias[
                                        evento.categoria
                                    ] || "Evento";


                                cabecalho.appendChild(
                                    titulo
                                );


                                cabecalho.appendChild(
                                    categoria
                                );


                                item.appendChild(
                                    cabecalho
                                );


                                // =========================================
                                // PERÍODO
                                // =========================================

                                if (
                                    evento.dataFim
                                ) {

                                    const periodo =
                                        document.createElement(
                                            'div'
                                        );


                                    periodo.className =
                                        'periodo-lista';


                                    periodo.innerText =

                                        `Período: ${formatarData(evento.dataInicio)} a ${formatarData(evento.dataFim)}`;


                                    item.appendChild(
                                        periodo
                                    );

                                }


                                // =========================================
                                // DESCRIÇÃO
                                // =========================================

                                if (
                                    evento.descricao
                                ) {

                                    const descricao =
                                        document.createElement(
                                            'p'
                                        );


                                    descricao.className =
                                        'descricao-lista';


                                    descricao.innerText =
                                        evento.descricao;


                                    item.appendChild(
                                        descricao
                                    );

                                }


                                areaEventos.appendChild(
                                    item
                                );

                            }

                        );


                        grupo.appendChild(
                            areaEventos
                        );


                        listaDiv.appendChild(
                            grupo
                        );

                    }

                );


            container.appendChild(
                listaDiv
            );

        }


        // ================================================================
        // ABRIR DETALHES DO DIA
        // ================================================================

        function abrirDetalhesDia(
            dataStr
        ) {

            const [
                ano,
                mes,
                dia
            ] =
                dataStr.split(
                    '-'
                );


            document.getElementById(
                'modal-data'
            ).innerText =

                `${dia}/${mes}/${ano}`;


            const areaDescricao =
                document.getElementById(
                    'modal-descricao'
                );


            areaDescricao.innerHTML =
                '';


            const eventosDoDia =
                buscarEventos(
                    dataStr
                );


            // ============================================================
            // SEM EVENTOS
            // ============================================================

            if (
                eventosDoDia.length ===
                0
            ) {

                const mensagem =
                    document.createElement(
                        'div'
                    );


                mensagem.className =
                    'modal-sem-evento';


                mensagem.innerText =

                    'Nenhum evento ou informação cadastrada para este dia.';


                areaDescricao.appendChild(
                    mensagem
                );

            }


            // ============================================================
            // COM EVENTOS
            // ============================================================

            else {

                eventosDoDia.forEach(

                    evento => {

                        const bloco =
                            document.createElement(
                                'div'
                            );


                        bloco.className =
                            'modal-evento';


                        // ================================================
                        // CATEGORIA
                        // ================================================

                        const categoria =
                            document.createElement(
                                'span'
                            );


                        categoria.className =

                            `categoria-modal ${evento.categoria}`;


                        categoria.innerText =

                            nomesCategorias[
                                evento.categoria
                            ] || "Evento";


                        bloco.appendChild(
                            categoria
                        );


                        // ================================================
                        // TÍTULO
                        // ================================================

                        const titulo =
                            document.createElement(
                                'strong'
                            );


                        titulo.innerText =
                            evento.titulo;


                        bloco.appendChild(
                            titulo
                        );


                        // ================================================
                        // PERÍODO
                        // ================================================

                        if (
                            evento.dataFim
                        ) {

                            const periodo =
                                document.createElement(
                                    'p'
                                );


                            periodo.className =
                                'modal-periodo';


                            periodo.innerText =

                                `Período: ${formatarData(evento.dataInicio)} a ${formatarData(evento.dataFim)}`;


                            bloco.appendChild(
                                periodo
                            );

                        }


                        // ================================================
                        // DESCRIÇÃO
                        // ================================================

                        if (
                            evento.descricao
                        ) {

                            const descricao =
                                document.createElement(
                                    'p'
                                );


                            descricao.innerText =
                                evento.descricao;


                            bloco.appendChild(
                                descricao
                            );

                        }


                        areaDescricao.appendChild(
                            bloco
                        );

                    }

                );

            }


            document.getElementById(
                'modal-dia'
            ).style.display =
                'flex';

        }


        // ================================================================
        // CRIA DATA LOCAL
        // ================================================================

        function criarDataLocal(
            data
        ) {

            const [
                ano,
                mes,
                dia
            ] =
                data.split(
                    '-'
                );


            return new Date(

                Number(
                    ano
                ),

                Number(
                    mes
                ) - 1,

                Number(
                    dia
                )

            );

        }


        // ================================================================
        // FORMATAR DATA
        // ================================================================

        function formatarData(
            data
        ) {

            if (!data) {

                return '';

            }


            const [
                ano,
                mes,
                dia
            ] =
                data.split(
                    '-'
                );


            return `${dia}/${mes}/${ano}`;

        }


        // ================================================================
        // FECHAR MODAL
        // ================================================================

        function fecharModal(
            event
        ) {

            const modal =
                document.getElementById(
                    'modal-dia'
                );


            if (

                !event

                ||

                event.target === modal

                ||

                event.target.classList.contains(
                    'modal-fechar'
                )

            ) {

                modal.style.display =
                    'none';

            }

        }


        // ================================================================
        // ALTERAR MÊS
        // ================================================================

        function mudarMes(
            direcao
        ) {

            dataVisualizacao.setMonth(

                dataVisualizacao.getMonth()
                +
                direcao

            );


            renderizarVisualizacao();

        }


        // ================================================================
        // VOLTAR PARA MÊS ATUAL
        // ================================================================

        function irParaHoje() {

            dataVisualizacao =
                new Date();


            renderizarVisualizacao();

        }


        // ================================================================
        // FECHAR MODAL COM ESC
        // ================================================================

        document.addEventListener(

            'keydown',

            function(event) {

                if (
                    event.key ===
                    'Escape'
                ) {

                    document.getElementById(
                        'modal-dia'
                    ).style.display =
                        'none';

                }

            }

        );


        // ================================================================
        // INICIAR
        // ================================================================

        renderizarVisualizacao();


    </script>

</body>
</html>
